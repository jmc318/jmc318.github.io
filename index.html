<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
<title>Beach Weather</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1d3a">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<div id="app">

  <header id="tabbar">
    <div id="tabs"></div>
    <button id="addTabBtn" aria-label="Add location">+</button>
  </header>

  <main id="panels"></main>

</div>

<div id="addModal" class="modal hidden">
  <div class="modal-card">
    <h2>Add a location</h2>
    <p class="hint">Type a city and state (like <code>Ocean City, NJ</code>), paste a
      forecast.weather.gov link, or type coordinates like <code>40.64, -74.35</code>.</p>
    <input id="addInput" type="text" placeholder="City, state / link / lat, lon" autocapitalize="words" autocorrect="off">
    <p id="addError" class="error hidden"></p>
    <div class="modal-actions">
      <button id="addCancelBtn" class="secondary">Cancel</button>
      <button id="addConfirmBtn">Add</button>
    </div>
  </div>
</div>

<div id="editModal" class="modal hidden">
  <div class="modal-card">
    <h2>Edit location</h2>
    <input id="editInput" type="text" placeholder="Location name">
    <div class="modal-actions">
      <button id="removeBtn" class="danger">Remove</button>
      <button id="editCancelBtn" class="secondary">Cancel</button>
      <button id="editConfirmBtn">Save</button>
    </div>
  </div>
</div>

<script src="app.js?v=14"></script>
</body>
</html>
